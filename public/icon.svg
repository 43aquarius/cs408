<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 408Lab 终端风格标签图标：终端窗口 + 408 + 闪烁光标 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101A16"/>
      <stop offset="1" stop-color="#0A100D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- 终端窗体 -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)" stroke="#10B981" stroke-opacity="0.6" stroke-width="2"/>

  <!-- 终端标题栏三灯 -->
  <circle cx="13.5" cy="12.5" r="2.6" fill="#F87171"/>
  <circle cx="22.5" cy="12.5" r="2.6" fill="#FBBF24"/>
  <circle cx="31.5" cy="12.5" r="2.6" fill="#34D399"/>
  <line x1="9" y1="19.5" x2="55" y2="19.5" stroke="#34D399" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- 408 -->
  <text x="23" y="45.5" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular','Courier New',ui-monospace,monospace" font-size="21" font-weight="700" fill="url(#glow)" letter-spacing="0.5">408</text>

  <!-- 闪烁光标 -->
  <rect x="45" y="39.5" width="10" height="6" rx="1.5" fill="#34D399">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
